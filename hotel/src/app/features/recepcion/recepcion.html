<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary fw-bold">
      <i class="bi bi-calendar-check me-2"></i> Tablero de Recepción
    </h3>

    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small">Filtrar por piso:</span>
      <select class="form-select form-select-sm"
              aria-label="Filtrar habitaciones por piso"
              [ngModel]="idPisoSeleccionado()"
              (ngModelChange)="idPisoSeleccionado.set($event)">
        <option [ngValue]="0">Todos los pisos</option>
        <option *ngFor="let p of pisos()" [ngValue]="p.idPiso">{{ p.descripcion || ('Piso ' + p.idPiso) }}</option>
      </select>

      <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" (click)="refrescarDatos()" title="Actualizar datos">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <!-- Indicador de Carga -->
  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Cargando habitaciones...</p>
  </div>

  <!-- Cuadrícula de Habitaciones -->
  <div class="row g-4" *ngIf="!isLoading()">
    <div class="col-12 col-md-6 col-lg-4 col-xl-3" *ngFor="let h of habitacionesFiltradas()">
      <div class="card h-100 shadow-sm border-0 transition-hover"
           [ngClass]="{
             'border-start border-4 border-success': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('libre') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('disponible'),
             'border-start border-4 border-danger': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('ocupado'),
             'border-start border-4 border-warning': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('limpieza') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('mantenimiento')
           }">
        <div class="card-body d-flex flex-column">

          <!-- Cabecera de la tarjeta: Número y Estado -->
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title fw-bold m-0 text-dark">
              <i class="bi bi-door-closed text-primary me-1"></i> Hab. {{ h.numero }}
            </h5>
            <span class="badge" [ngClass]="{
              'bg-success-subtle text-success': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('libre') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('disponible'),
              'bg-danger-subtle text-danger': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('ocupado'),
              'bg-warning-subtle text-warning text-dark': getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('limpieza') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('mantenimiento')
            }">
              {{ getEstNombre(h.idEstadoHabitacion) }}
            </span>
          </div>

          <!-- Categoría y Precio -->
          <p class="text-muted small mb-1">
            <i class="bi bi-tag me-1"></i> Categoría: <strong class="text-secondary">{{ getCatNombre(h.idCategoria) }}</strong>
          </p>

          <p class="text-dark small fw-semibold mb-2">
            <i class="bi bi-cash-coin me-1"></i> Precio: S/ {{ h.precio | number:'1.2-2' }}
          </p>

          <!-- Piso -->
          <p class="text-muted small mb-3 mt-auto">
            <i class="bi bi-building me-1"></i> Piso ID: {{ h.idPiso }}
          </p>

          <!-- Botón de Acción Dinámico -->
          <button class="btn btn-sm w-100 mt-2"
                  [ngClass]="(getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('libre') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('disponible')) ? 'btn-primary' : 'btn-danger'"
                  (click)="abrirDetalle(h)">
            <i class="bi me-1" [ngClass]="(getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('libre') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('disponible')) ? 'bi-plus-circle' : 'bi-eye'"></i>
            {{ (getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('libre') || getEstNombre(h.idEstadoHabitacion).toLowerCase().includes('disponible')) ? 'Registrar Ingreso' : 'Ver Detalle / Salida' }}
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay resultados -->
  <div *ngIf="!isLoading() && habitacionesFiltradas().length === 0" class="text-center py-5">
    <i class="bi bi-search text-muted" style="font-size: 2.5rem;"></i>
    <p class="text-muted mt-2">No se encontraron habitaciones para este filtro.</p>
  </div>
</div>

<style>
  .transition-hover { transition: transform 0.2s ease-in-out; }
  .transition-hover:hover { transform: translateY(-4px); }
</style>
